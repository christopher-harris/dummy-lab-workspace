name: Deploy Cloudflare Pages to dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A dev deployment is always a complete, immutable release artifact. It is
# retained so the promotion workflow can deploy this exact output later.
concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: false

env:
  # Kept inline so a checkout from a historical commit cannot fail because it
  # predates the repository's .nvmrc file.
  NODE_VERSION: 22.23.0

jobs:
  # Prerendering fetches CMS content at build time, so the build needs the
  # same RUNTIME_CONFIG_JSON the Pages project serves the browser. It is read
  # from Cloudflare rather than duplicated in GitHub, so the Pages variable
  # stays the one place it is set.
  #
  # Its own job because the Cloudflare credentials are scoped to the `dev`
  # environment, and the build job is deliberately environment-free. Read
  # through the API, not from /runtime-config.json on the live site: that
  # endpoint is served by the *currently deployed* function, which can reject
  # a config shape the commit being built is the one to introduce.
  runtime-config:
    name: Read runtime config from Cloudflare Pages
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      json: ${{ steps.read.outputs.json }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: dummy-lab-dev
    steps:
      - id: read
        name: Read RUNTIME_CONFIG_JSON
        shell: bash
        run: |
          set -euo pipefail
          # A Secret-type Pages variable comes back without a value, and
          # `fromjson` on null fails — so this also catches a variable that
          # was saved as a secret instead of plain text.
          config=$(
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" |
              jq -ce '.result.deployment_configs.production.env_vars.RUNTIME_CONFIG_JSON.value | fromjson'
          ) || {
            echo "::error::Could not read RUNTIME_CONFIG_JSON from Pages project $CLOUDFLARE_PAGES_PROJECT. It must be a plain-text (not secret) production variable holding valid JSON."
            exit 1
          }
          echo "json=$config" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifact once
    needs: runtime-config
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - id: revision
        name: Record resolved revision
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The build refuses to start without RUNTIME_CONFIG_JSON (see
      # app.config.server.ts). The prerendered HTML carries content from
      # whichever CMS it names — dev's — so the artifact is only
      # environment-neutral while every environment shares one CMS.
      #
      # --skip-nx-cache: neither this variable nor CMS content is an Nx input,
      # so a cache hit (local or Nx Cloud) would ship HTML prerendered against
      # another CMS, or against content as it was when that build ran.
      - name: Build dummy-lab
        env:
          RUNTIME_CONFIG_JSON: ${{ needs.runtime-config.outputs.json }}
        run: npm exec nx -- build dummy-lab --configuration=production --base-href=/ --skip-nx-cache

      # The artifact contains the static Angular output and Pages Function
      # source. Wrangler discovers the sibling functions directory during
      # deployment; no deployment job rebuilds Angular.
      - name: Package immutable Cloudflare Pages release
        shell: bash
        run: |
          set -euo pipefail
          dist_dir=dist/apps/dummy-lab/browser
          release_dir=cloudflare-pages-release

          test -f "$dist_dir/index.html" || {
            echo "::error::No Angular browser output found at $dist_dir"
            exit 1
          }
          test -d apps/dummy-lab/functions || {
            echo "::error::No Pages Functions source found at apps/dummy-lab/functions"
            exit 1
          }

          mkdir "$release_dir"
          cp -R "$dist_dir" "$release_dir/browser"
          cp -R apps/dummy-lab/functions "$release_dir/functions"
          (
            cd "$release_dir"
            find browser functions -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-release
          path: cloudflare-pages-release
          if-no-files-found: error
          retention-days: 14

  deploy-dev:
    name: Deploy release to dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: dummy-lab-dev
    steps:
      # This checkout supplies package-lock.json for the Wrangler install. It
      # uses the build job's resolved commit and never contributes app output.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
          filter: tree:0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # This installs Wrangler only. The Angular build output comes solely
      # from the immutable artifact created by the build job.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-release
          path: cloudflare-pages-release

      - name: Verify downloaded release
        working-directory: cloudflare-pages-release
        run: sha256sum --check SHA256SUMS

      - name: Deploy exact release artifact
        working-directory: cloudflare-pages-release
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm exec wrangler -- pages deploy browser \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "${{ needs.build.outputs.commit_sha }}" \
            --commit-message "${{ github.workflow }} #${{ github.run_number }}" \
            --commit-dirty=true
