# The "production" CMS: Strapi, Postgres and Caddy on one host.
#
# Separate from compose.yaml on purpose. That file is the local dev database
# behind `nx run cms:db`; adding Strapi to it would start a second Strapi on
# :1337 every time `nx serve cms` brings the database up.
#
# Deployed by .github/workflows/deploy-cms.yml, which builds the Strapi image
# in CI, pushes it to ECR, and has the host pull it (deploy/remote-deploy.sh).
# The host never builds. By hand, on the host:
#
#   docker compose -f compose.prod.yaml --env-file .env.production up -d
#
# `--env-file` is not optional. Without it Compose interpolates from `.env`,
# the committed local-dev file, and the stack comes up on dev credentials.
# `.env.production.example` lists what goes in it; CMS_IMAGE is written there
# by each deploy, so manual commands run the same image the pipeline shipped.
#
# Caddy terminates TLS and fetches the certificate itself. HTTPS is not a
# nicety here: the Pages runtime-config adapter rejects any non-https
# `cmsBaseUrl`, and the browser loads media straight from this host.

name: dummy-lab-cms

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?set in .env.production}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${DATABASE_NAME:?set in .env.production}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 5s
      retries: 12

  strapi:
    # An ECR URI tagged with the commit SHA. No `build:` — a 2 GB host can't
    # build the admin panel without swapping for minutes.
    image: ${CMS_IMAGE:?written to .env.production by deploy/remote-deploy.sh}
    restart: unless-stopped
    # What `up --wait` blocks on, so a deploy fails loudly if Strapi doesn't
    # come up instead of reporting success the moment the container starts.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:1337/_health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    env_file: .env.production
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      PUBLIC_URL: https://${CMS_DOMAIN:?set in .env.production}
      # Caddy sits in front, so trust X-Forwarded-Proto. Without it Strapi
      # sees plain HTTP and refuses to set the admin's secure session cookies.
      IS_PROXIED: 'true'
    volumes:
      # The volume holds all of public/, not just public/uploads.
      # `strapi transfer` backs up existing media by renaming
      # public/uploads to a sibling folder, and a mount point can't be
      # renamed. With uploads mounted directly, every push fails with "The
      # backup folder for the assets could not be created".
      - public:/opt/app/public
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CMS_DOMAIN: ${CMS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Losing this volume means re-issuing, and Let's Encrypt
      # rate-limits repeat issuance for the same hostname.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - strapi

volumes:
  db-data:
  public:
  caddy-data:
  caddy-config:
