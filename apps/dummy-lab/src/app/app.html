@if (runtimeConfig.environment !== 'prod') {
<div
  class="border-b border-amber-300 bg-amber-100 px-4 py-2 text-center text-sm font-medium text-amber-950"
  role="status"
>
  {{ runtimeConfig.environment }} environment
</div>
} @if (runtimeConfig.features.experimentalCatalog) {
<div
  class="border-b border-sky-300 bg-sky-100 px-4 py-2 text-center text-sm text-sky-950"
  data-testid="experimental-catalog-status"
>
  Experimental catalog is enabled by runtime configuration.
</div>
}

<!-- The footer is a shell concern and stays here, but routed pages are lazy
     (`loadComponent`), so with an empty outlet it would paint at the top of the
     viewport and then get shoved down once the page arrives — a ~0.88 layout
     shift on the landing page. Reserving a screenful keeps the footer below the
     fold at first paint; CLS only counts elements that shift while visible, so
     its later move costs nothing. -->
<div class="min-h-screen">
  <router-outlet />
</div>

<dl-footer />
