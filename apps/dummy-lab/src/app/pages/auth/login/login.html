<form [formGroup]="loginForm" class="flex flex-col gap-6 w-full">
  <div class="flex flex-col gap-2 w-full">
    <label for="username1" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Username</label>
    <input pInputText id="username1" type="text" placeholder="Username" formControlName="username"
           class="w-full px-3 py-2 shadow-sm rounded-lg"/>
  </div>
  <div class="flex flex-col gap-2 w-full">
    <label for="password1" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Password</label>
    <input pInputText id="password1" type="password" placeholder="Password" formControlName="password"
           class="w-full px-3 py-2 shadow-sm rounded-lg"/>
  </div>
<!--  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-3 sm:gap-0">-->
<!--    <div class="flex items-center gap-2">-->
<!--      <p-checkbox id="rememberme1" [(ngModel)]="checked1" [binary]="true"></p-checkbox>-->
<!--      <label for="rememberme1" class="text-surface-900 dark:text-surface-0 leading-normal">Remember me</label>-->
<!--    </div>-->
<!--    <a class="text-primary font-medium cursor-pointer hover:text-primary-emphasis">Forgot your password?</a>-->
<!--  </div>-->
  <pre>{{ authStore.loginUserStatus() }}</pre>
  <p-button (onClick)="onSignInClicked()"
            [disabled]="authStore.loginUserStatus() === 'pending'"
            fluid
            [icon]="'pi pi-user'"
            type="submit"
            class="w-full py-2 rounded-lg flex justify-center items-center gap-2"
            [label]="'Sign In'" />
</form>
