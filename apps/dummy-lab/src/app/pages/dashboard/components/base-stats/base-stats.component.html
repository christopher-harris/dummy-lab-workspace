<div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-4">
  @for (stat of stats(); track stat.label) {
    <div class="bg-surface-0 dark:bg-surface-900 shadow-sm p-5 rounded-2xl">
      <div class="flex justify-between gap-4">
        <div class="flex flex-col gap-2">
          <span class="text-surface-700 dark:text-surface-300 font-normal leading-tight">{{ stat.label }}</span>
          @if (stat.loading) {
            <p-skeleton class="w-20 h-8" />
<!--            <div class="bg-surface-200 dark:bg-surface-700 rounded-md w-20 h-8 animate-pulse"></div>-->
          } @else {
            <div class="text-surface-900 dark:text-surface-0 font-semibold text-2xl! leading-tight!">{{ stat.value }}</div>
          }
        </div>
        <div
          class="flex items-center justify-center bg-linear-to-b rounded-lg w-10 h-10"
          [class]="stat.iconGradient"
        >
          <i class="pi text-surface-0 dark:text-surface-900 text-xl! leading-none!" [class]="stat.icon"></i>
        </div>
      </div>
<!--      <div class="mt-4">-->
<!--        @if (stat.highlight) {-->
<!--          <span class="text-surface-600 dark:text-surface-300 font-medium leading-tight">{{ stat.highlight }}</span>-->
<!--        }-->
<!--        <span class="text-surface-500 dark:text-surface-300 leading-tight">{{ stat.footnote }}</span>-->
<!--      </div>-->
    </div>
  }
</div>
